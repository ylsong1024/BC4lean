name: Build BC4lean

on:
  push:
    branches: [main]
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'scripts/check_project_imports.py'
      - 'scripts/audit_chapter5.py'
      - 'scripts/test_audit_chapter5.py'
      - 'blueprint/src/parts/05-equivariant-kk.tex'
      - '.github/workflows/build-project.yml'
  # Run for every PR so a required check is never left pending by a path filter.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check project imports
        run: python3 scripts/check_project_imports.py

      - name: Check Chapter 5 target inventory safeguards
        run: python3 -B scripts/test_audit_chapter5.py

      - name: Install Lean and get the pinned Mathlib cache
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'true'

      - name: Build project with warnings as errors
        run: lake --wfail build BC4lean

      - name: Audit Chapter 5 declarations and report unfinished targets
        run: python3 scripts/audit_chapter5.py
