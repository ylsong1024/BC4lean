# Replace .github/workflows/blueprint.yml with this file.
# Disable the separate "Build and Deploy Pages" workflow before pushing.
# Publishes home_page and blueprint HTML; does not build Lean, API docs, or PDF.
name: Publish blueprint

on:
  push:
    branches: [main]
    paths:
      - 'blueprint/src/**'
      - 'home_page/**'
      - 'scripts/update_chapter5_finder.py'
      - 'scripts/update_chapter6_finder.py'
      - 'scripts/test_blueprint_status.py'
      - 'scripts/check_website.py'
      - 'scripts/audit_chapter5.py'
      - 'scripts/audit_chapter6.py'
      - 'scripts/test_audit_chapter6.py'
      - 'scripts/check_project_imports.py'
      - 'scripts/*chapter7*.py'
      - 'scripts/*chapter8*.py'
      - 'docs/audits/chapter5/**'
      - 'docs/audits/chapter6/**'
      - 'docs/audits/chapter7/**'
      - 'docs/audits/chapter8/**'
      - 'docs/CHAPTER5_COMPLETION.md'
      - 'docs/CHAPTER6_*.md'
      - 'docs/CHAPTER7_*.md'
      - 'docs/CHAPTER8_*.md'
      - '.github/workflows/blueprint.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check retained and new source links and proof-status safeguards
        run: |
          python3 -B scripts/update_chapter5_finder.py --check
          python3 -B scripts/update_chapter6_finder.py --check
          python3 -B scripts/test_audit_chapter7.py
          python3 -B scripts/test_chapter7_publication.py
          python3 -B scripts/test_chapter7_website.py
          python3 -B scripts/test_blueprint_status.py
          python3 -B scripts/test_chapter7_retained.py
          python3 -B scripts/test_audit_chapter8.py
          python3 -B scripts/run_chapter8_publication_tests.py
          python3 -B - <<'PYTHON'
          import json
          from pathlib import Path
          import subprocess
          import sys
          record = json.loads(Path("docs/audits/chapter8/audit.json").read_text())
          subprocess.run([sys.executable, "-B", "scripts/update_chapter8_finder.py",
              "--root", str(Path.cwd()), "--source-revision", record["source_revision"],
              "--provider-sha256", "dcc7a783f842e8196b71bd6e1499e00821e98214e8efbc81bc648ca41628d7d8", "--check"], check=True)
          PYTHON
      - uses: actions/configure-pages@v5
      - name: Install blueprint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev python3-dev python3-venv texlive-binaries
          python3 -m venv .venv
          .venv/bin/pip install leanblueprint plastexshowmore
      - name: Build blueprint HTML
        working-directory: blueprint/src
        run: '${{ github.workspace }}/.venv/bin/python build_web.py'
      - name: Build existing homepage
        uses: actions/jekyll-build-pages@v1
        with:
          source: home_page
          destination: ./_site
      - name: Include blueprint
        run: |
          # Jekyll runs in Docker; assemble the site in a runner-owned directory.
          mkdir -p "$RUNNER_TEMP/pages"
          cp -R _site/. "$RUNNER_TEMP/pages/"
          mkdir -p "$RUNNER_TEMP/pages/blueprint"
          cp -R blueprint/web/. "$RUNNER_TEMP/pages/blueprint/"
          touch "$RUNNER_TEMP/pages/.nojekyll"
      - name: Verify assembled retained and new milestones and record deployed revision
        run: |
          python3 -B - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          record = json.loads(Path("docs/audits/chapter8/audit.json").read_text())
          subprocess.run([sys.executable, "-B", "scripts/check_chapter8_website.py",
              "--root", str(Path.cwd()), "--source-revision", record["source_revision"],
              "--provider-sha256", "dcc7a783f842e8196b71bd6e1499e00821e98214e8efbc81bc648ca41628d7d8", "--revision", os.environ["GITHUB_SHA"],
              str(Path(os.environ["RUNNER_TEMP"]) / "pages")], check=True)
          PYTHON
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
